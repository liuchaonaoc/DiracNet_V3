# Stage A — Lowdin variant: same as v3_stage_a_z1_26_n10.yaml
# but with apply_lowdin=true to test if Lowdin orthogonalization
# helps the l=0 Z=3-4 bottleneck.
#
# IMPORTANT (per orthogonalizer.py):
#   apply_lowdin=True calls lowdin_orthonormalize(..., normalize=True, use_full_lowdin=False)
#   This means: per-orbital ||P||^2 + ||Q||^2 = 1 (forces normalization)
#   but does NOT do S^{-1/2} mixing (use_full_lowdin=False is hard-coded in the caller).
#
# This config is for testing whether the normalize-only effect helps l=0.
# It will likely HURT norm_loss supervision (because P,Q are already normalized).
#
# Date: 2026-06-09

seed: 42

grid:
  r_min: 1.0e-2
  r_max: 50.0
  n_grid: 256
  scheme: loglinear

coords:
  c1: 1.0
  c2: 1.0

model:
  n_orb_max: 16
  n_csf_max: 8
  d_branch: 128
  d_trunk: 128
  n_siren_layers: 4
  omega_0: 20.0
  apply_lowdin: true        # CHANGED: turn on Lowdin normalize
  use_hydrogenic_skeleton: true
  perturb_eps: 0.2
  use_zeff_warmstart: true

ci:
  enabled: false
  nist_inject: false
  k_list: [0, 1, 2]
  M_max: 8
  racah_cache: data_cache/racah_cache_z1_26_n10.npz

# R1.5 — self-consistent DFS local central potential
dfs:
  enabled: true
  alpha_x: 1.0
  latter_tail: true
  anchor_vprior: true
  fermi_amaldi: true
  scf_weight_mode: density

stage_a:
  n_epochs: 4000
  batch_size: 16
  weights:
    pde: 1.0
    ortho: 100.0
    asym: 0.1
    norm: 10.0
    v_prior: 1.0
    v_smooth: 1.0e-6
    scf: 5.0
  gate:
    cos_threshold: 0.99
    pde_threshold: 1.0e-2
    e_orb_meV_threshold: 50.0
  eval:
    single_valence:
      mae_meV_threshold: 50.0
      rel_err_threshold: 0.002
    multi_electron:
      mae_meV_threshold: 500.0
      rel_err_threshold: 0.01

optimizer:
  lr_trunk: 3.0e-4
  lr_branch: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0

training:
  ckpt_dir: ./checkpoints/v3_stage_a_z1_26_n10_lowdin
  log_dir: ./logs/v3_stage_a_z1_26_n10_lowdin
  steps_per_epoch: 24
  val_every_epochs: 25
  ckpt_every_epochs: 50
  shuffle_each_epoch: true

dataset:
  manifest: data_cache/manifest_nist_z1_26_n10.parquet
  prepare: nist_z1_26_n10
  n_orb_max: 16
  n_csf_max: 8
