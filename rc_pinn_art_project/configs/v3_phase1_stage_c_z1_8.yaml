# Stage C — infer + NIST hybrid diagonal fill (no training)
#
# Prerequisites:
#   - Stage B checkpoint: checkpoints/v3_phase1_stage_b_z1_8/stage_b_last.msgpack
#   - NIST manifest: data_cache/manifest_nist_z1_8.parquet
#   - Racah cache: data_cache/racah_cache_z1_8.npz

seed: 42

grid:
  r_min: 1.0e-2
  r_max: 50.0
  n_grid: 256
  scheme: loglinear

coords:
  c1: 1.0
  c2: 1.0

model:
  n_orb_max: 16
  n_csf_max: 8
  d_branch: 128
  d_trunk: 128
  n_siren_layers: 4
  omega_0: 20.0
  apply_lowdin: true
  use_hydrogenic_skeleton: true
  perturb_eps: 0.2

ci:
  enabled: true
  nist_inject: true
  k_list: [0, 1, 2]
  M_max: 8
  eps_degen_meV: 1.0e-3
  racah_cache: data_cache/racah_cache_z1_8.npz
  diagonal_fill: hybrid

stage_c:
  ckpt: checkpoints/v3_phase1_stage_b_z1_8/stage_b_last.msgpack
  gate:
    mae_exc_orb_nist_meV_threshold: 500.0   # layer2_orb 主指标（Phase 2a）
    mae_inject_sanity_meV_threshold: 1.0    # layer2_inject 对角注入自检
    mae_exc_nist_meV_threshold: 50.0          # 兼容旧字段

training:
  log_dir: ./logs/v3_phase1_stage_c_z1_8

dataset:
  manifest: data_cache/manifest_nist_z1_8.parquet
  n_orb_max: 16
  n_csf_max: 8
