# Stage A — Round 2' (A'): self-consistent DFS, Z=1..26, n<=10
# Purpose: 强化 SCF 软约束, 修复 He 1s² V_net 在 r=0.3-3 (|ψ|² 峰值区) 偏浅 0.2-0.4 Ha
# 根因 (per PROGRESS_REPORT §11.5, §11.7):
#   - E_orb = <ψ|H|ψ>, 对 V 在 |ψ|² 小的 r 区间的修改免疫
#   - 修复路径: 训练时让 V_net 在 |ψ|² 峰值区 (r∈[0.3, 3]) 整体加深
#   - 关键: 加大 scf_weight (5.0 → 15.0), 同时收紧 r-mode 到 "r" 重点关注中间区
# 期望: He 1s² E_orb 从 -1.36 Ha → -1.7 Ha (偏浅 1.5 Ha → 0.5 Ha)
#       He 1s² E_orb_omega 从 -2.73 Ha → -3.4 Ha (偏浅 0.2 Ha)
# 风险: H 锚点可能漂移 5-20 meV
# 验证: 跑 v3_verify_eorb_depend_on_r.py 看 r=0.3-3 区间 diff 是否从 0.66 降到 < 0.2 Ha

seed: 42

grid:
  r_min: 1.0e-2
  r_max: 50.0
  n_grid: 256
  scheme: loglinear

coords:
  c1: 1.0
  c2: 1.0

model:
  n_orb_max: 16
  n_csf_max: 8
  d_branch: 128
  d_trunk: 128
  n_siren_layers: 4
  omega_0: 20.0
  apply_lowdin: false
  use_hydrogenic_skeleton: true
  perturb_eps: 0.2
  use_zeff_warmstart: true

ci:
  enabled: false
  nist_inject: false
  k_list: [0, 1, 2]
  M_max: 8
  racah_cache: data_cache/racah_cache_z1_26_n10.npz

# R1.5 + A' 加强: SCF 软约束从 5.0 提到 15.0 (3x)
# scf_weight_mode 改为 "r3" 重点关注中间 r 区 (与 E-prime 的 "density" 不同)
dfs:
  enabled: true
  alpha_x: 1.0
  latter_tail: true
  anchor_vprior: true
  fermi_amaldi: true
  scf_weight_mode: density # 保持 E-prime 原模式 (P1: density-weighted)

stage_a:
  n_epochs: 4000
  batch_size: 16
  weights:
    pde: 1.0
    ortho: 100.0
    asym: 0.1
    norm: 10.0
    v_prior: 1.0
    v_smooth: 1.0e-6
    scf: 15.0              # A': 5.0 → 15.0 (3x 强化 SCF 软约束)
  gate:
    cos_threshold: 0.99
    pde_threshold: 1.0e-2
    e_orb_meV_threshold: 50.0
  eval:
    single_valence:
      mae_meV_threshold: 50.0
      rel_err_threshold: 0.002
    multi_electron:
      mae_meV_threshold: 500.0
      rel_err_threshold: 0.01

optimizer:
  lr_trunk: 3.0e-4
  lr_branch: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0

training:
  ckpt_dir: ./checkpoints/v3_stage_a_z1_26_n10
  log_dir: ./logs/v3_stage_a_z1_26_n10
  steps_per_epoch: 24
  val_every_epochs: 25
  ckpt_every_epochs: 50
  shuffle_each_epoch: true

dataset:
  manifest: data_cache/manifest_nist_z1_26_n10.parquet
  prepare: nist_z1_26_n10
  n_orb_max: 16
  n_csf_max: 8
