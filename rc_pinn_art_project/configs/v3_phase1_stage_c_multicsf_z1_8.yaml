# Stage C Phase 2c — multi-CSF (2p doublet) evaluation

seed: 42

grid:
  r_min: 1.0e-2
  r_max: 50.0
  n_grid: 256
  scheme: loglinear

coords:
  c1: 1.0
  c2: 1.0

model:
  n_orb_max: 16
  n_csf_max: 8
  d_branch: 128
  d_trunk: 128
  n_siren_layers: 4
  omega_0: 20.0
  apply_lowdin: true
  use_hydrogenic_skeleton: true
  perturb_eps: 0.2

ci:
  enabled: true
  nist_inject: true
  k_list: [0, 1, 2]
  M_max: 8
  eps_degen_meV: 1.0e-3
  racah_cache: data_cache/racah_cache_multicsf_z1_8.npz

stage_c:
  ckpt: checkpoints/v3_phase1_stage_b_z1_8/stage_b_last.msgpack
  gate:
    mae_exc_orb_nist_meV_threshold: 500.0
    mae_inject_sanity_meV_threshold: 1.0

training:
  log_dir: ./logs/v3_phase1_stage_c_multicsf_z1_8

dataset:
  manifest: data_cache/manifest_nist_multicsf_z1_8.parquet
  n_orb_max: 16
  n_csf_max: 8
