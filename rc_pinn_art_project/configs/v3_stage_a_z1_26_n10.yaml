# Stage A — Round 2: self-consistent DFS, Z=1..26, n<=10
# See prompts/16_stage_a_selfconsistent_dfs.md (Phase R1).
# Energy scale is set by the screened DFS potential (V_H + V_x + Latter tail),
# anchored via L_scf — NOT by the bare nuclear -Z/r.

seed: 42

grid:
  r_min: 1.0e-2
  r_max: 50.0
  n_grid: 256
  scheme: loglinear

coords:
  c1: 1.0
  c2: 1.0

model:
  n_orb_max: 16          # >= 11 (max kappa-resolved orbitals in the enumeration)
  n_csf_max: 8
  d_branch: 128
  d_trunk: 128
  n_siren_layers: 4
  omega_0: 20.0
  apply_lowdin: false
  use_hydrogenic_skeleton: true
  perturb_eps: 0.2
  use_zeff_warmstart: true  # R1.3: Slater Z_eff skeleton warm-start (screened nodes)

ci:
  enabled: false
  nist_inject: false
  k_list: [0, 1, 2]
  M_max: 8
  racah_cache: data_cache/racah_cache_z1_26_n10.npz

# R1.5 — self-consistent DFS local central potential
dfs:
  enabled: true
  alpha_x: 1.0           # Slater X-alpha exchange parameter
  latter_tail: true      # clamp asymptote to -(Z-N+1)/r
  anchor_vprior: true    # v_prior anchors to V_dfs (instead of bare -Z/r)
  fermi_amaldi: true     # P0 fix: (N-1)/N self-interaction correction on V_H+V_x
  scf_weight_mode: density  # P1: weight SCF by rho(r), not r^2 (see EXCITATION_VS_NIST.md §C)

stage_a:
  n_epochs: 4000
  batch_size: 16
  weights:
    pde: 1.0
    ortho: 100.0
    asym: 0.1
    norm: 10.0
    v_prior: 1.0         # weak DFS anchor (drift guard)
    v_smooth: 1.0e-6
    scf: 5.0             # R1.4: main self-consistency driver toward V_dfs[rho]
  gate:
    cos_threshold: 0.99
    pde_threshold: 1.0e-2
    e_orb_meV_threshold: 50.0
  eval:
    single_valence:
      mae_meV_threshold: 50.0
      rel_err_threshold: 0.002
    multi_electron:
      mae_meV_threshold: 500.0
      rel_err_threshold: 0.01

optimizer:
  lr_trunk: 3.0e-4
  lr_branch: 1.0e-4
  weight_decay: 1.0e-4
  grad_clip: 1.0

training:
  ckpt_dir: ./checkpoints/v3_stage_a_z1_26_n10
  log_dir: ./logs/v3_stage_a_z1_26_n10
  steps_per_epoch: 24
  val_every_epochs: 25
  ckpt_every_epochs: 50
  shuffle_each_epoch: true

dataset:
  manifest: data_cache/manifest_nist_z1_26_n10.parquet
  prepare: nist_z1_26_n10
  n_orb_max: 16
  n_csf_max: 8
